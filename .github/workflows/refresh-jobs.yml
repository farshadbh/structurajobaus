name: Refresh job listings

# 06:00 Australia/Sydney during daylight saving (AEDT, UTC+11).
# During standard time (AEST, UTC+10) this runs at 05:00 local — never later than 6am.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Each source is optional: the script skips any key that is not set, so the
      # workflow succeeds (with a warning) before the first credential exists.
      - name: Fetch latest listings
        env:
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/ingest-jobs.mjs

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "No changes to data/jobs.json"
            exit 0
          fi
          git config user.name "jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore(data): refresh job listings"
          git push
